<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- LeGM-CP architecture, redrawn in the Cortex site style. Large type so it stays
       legible when shown as a ~300px tile; click opens it full size. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#111c36"/>
      <stop offset="1" stop-color="#070a14"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="640" height="500" fill="url(#bg)"/>
  <g fill="#94c5ff" opacity=".2">
    <circle cx="30" cy="110" r="2"/><circle cx="612" cy="120" r="1.6"/><circle cx="40" cy="300" r="1.6"/>
    <circle cx="604" cy="290" r="2"/><circle cx="318" cy="486" r="1.4"/>
  </g>

  <!-- title -->
  <text x="28" y="42" fill="#f1f5f9" font-size="24" font-weight="800" letter-spacing="-.01em">LeGM-CP</text>
  <text x="140" y="42" fill="#94a3b8" font-size="20">MCP architecture</text>

  <!-- links -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M320 178 V232" stroke="#38bdf8" stroke-opacity=".8"/>
    <path d="M320 318 V348 M112 348 H528 M112 348 V376 M320 348 V376 M528 348 V376" stroke="#94c5ff" stroke-opacity=".45"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="320" cy="348" r="5" fill="#e0f2fe"/>
    <circle cx="112" cy="376" r="4.5" fill="#fbbf24"/>
    <circle cx="320" cy="376" r="4.5" fill="#f472b6"/>
    <circle cx="528" cy="376" r="4.5" fill="#34d399"/>
  </g>

  <!-- MCP Host -->
  <rect x="40" y="76" width="560" height="102" rx="18" fill="#a78bfa" opacity=".2" filter="url(#soft)"/>
  <rect x="40" y="76" width="560" height="102" rx="18" fill="#0d1326" stroke="#a78bfa" stroke-width="2"/>
  <rect x="62" y="62" width="130" height="28" rx="14" fill="#1a1433" stroke="#a78bfa"/>
  <text x="127" y="81.5" fill="#c4b5fd" font-size="15" font-weight="800" text-anchor="middle" letter-spacing=".08em">MCP HOST</text>

  <rect x="62" y="102" width="252" height="58" rx="14" fill="#151d38" stroke="#a78bfa" stroke-opacity=".35"/>
  <g transform="translate(94 131)" stroke="#d97757" stroke-width="3.4" stroke-linecap="round">
    <line x1="0" y1="-14" x2="0" y2="14"/><line x1="-14" y1="0" x2="14" y2="0"/>
    <line x1="-10" y1="-10" x2="10" y2="10"/><line x1="-10" y1="10" x2="10" y2="-10"/>
  </g>
  <text x="122" y="139" fill="#f8fafc" font-size="23" font-weight="700">Claude 3.7</text>

  <rect x="326" y="102" width="252" height="58" rx="14" fill="#151d38" stroke="#a78bfa" stroke-opacity=".35"/>
  <circle cx="358" cy="131" r="16" fill="#000" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M351.5 139 V123 L365 141 M365 123 V133" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <text x="386" y="139" fill="#f8fafc" font-size="23" font-weight="700">Next.js UI</text>

  <!-- MCP Client pill -->
  <rect x="238" y="190" width="164" height="32" rx="16" fill="#0b1a2b" stroke="#38bdf8"/>
  <text x="320" y="212" fill="#7dd3fc" font-size="16" font-weight="800" text-anchor="middle" letter-spacing=".06em">MCP CLIENT</text>

  <!-- MCP Server -->
  <rect x="140" y="238" width="360" height="80" rx="18" fill="#38bdf8" opacity=".18" filter="url(#soft)"/>
  <rect x="140" y="238" width="360" height="80" rx="18" fill="#0d1326" stroke="#38bdf8" stroke-width="2"/>
  <g transform="translate(176 258)" fill="none" stroke="#38bdf8" stroke-width="2.6">
    <ellipse cx="20" cy="6" rx="20" ry="6"/>
    <path d="M0 6 V34 C0 42 40 42 40 34 V6"/>
    <path d="M0 15.5 C0 23.5 40 23.5 40 15.5 M0 25 C0 33 40 33 40 25"/>
  </g>
  <text x="236" y="286" fill="#f8fafc" font-size="24" font-weight="700">MCP Server</text>
  <text x="236" y="306" fill="#94a3b8" font-size="15">LeGM-CP</text>

  <!-- capability cards -->
  <rect x="20" y="384" width="184" height="88" rx="16" fill="#0d1326" stroke="#fbbf24" stroke-width="2"/>
  <g transform="translate(38 402)" stroke="#fbbf24" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 2 a7 7 0 0 0 -8.5 9.5 L1.5 18.5 l4 4 7 -7 a7 7 0 0 0 9.5 -8.5 l-5 5 -4 -4 z"/>
  </g>
  <text x="72" y="424" fill="#fde68a" font-size="21" font-weight="800">Tools</text>
  <text x="38" y="456" fill="#cbd5e1" font-size="16">live NBA stats</text>

  <rect x="228" y="384" width="184" height="88" rx="16" fill="#0d1326" stroke="#f472b6" stroke-width="2"/>
  <g transform="translate(246 400)" stroke="#f472b6" stroke-width="2.6" fill="none" stroke-linejoin="round">
    <path d="M2 1 h12 l7 7 v17 h-19 z M14 1 v7 h7"/>
  </g>
  <text x="278" y="424" fill="#fbcfe8" font-size="21" font-weight="800">Resources</text>
  <text x="246" y="456" fill="#cbd5e1" font-size="16">ranking PDFs</text>

  <rect x="436" y="384" width="184" height="88" rx="16" fill="#0d1326" stroke="#34d399" stroke-width="2"/>
  <g transform="translate(454 403)" stroke="#34d399" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="24" height="19" rx="4"/><path d="M6 7 l4 3 -4 3 M13 14 h6"/>
  </g>
  <text x="488" y="424" fill="#a7f3d0" font-size="21" font-weight="800">Prompts</text>
  <text x="454" y="456" fill="#cbd5e1" font-size="16">draft strategy</text>
</svg>
