<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" role="img" aria-label="E.Ngine Games">
  <!-- The E.Ngine Games logo on a dark card (for project tiles, which fill with a light background). -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#1a1f4a"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
  </defs>
  <rect width="620" height="340" fill="url(#bg)"/>
  <g transform="translate(50 85)">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pixel arcade joystick emblem (8-bit, square-cornered) -->
  <g transform="translate(14 22)" shape-rendering="crispEdges">
    <rect x="0" y="0" width="120" height="120" fill="#0b1022" stroke="url(#word)" stroke-width="6"/>
    <!-- stick ball -->
    <g fill="#f43f5e">
      <rect x="44" y="18" width="24" height="8"/>
      <rect x="36" y="26" width="40" height="24"/>
      <rect x="44" y="50" width="24" height="6"/>
    </g>
    <rect x="44" y="26" width="10" height="8" fill="#fecdd3"/>
    <!-- shaft -->
    <rect x="52" y="56" width="8" height="22" fill="#cbd5e1"/>
    <!-- base -->
    <rect x="20" y="78" width="80" height="12" fill="#818cf8"/>
    <rect x="14" y="90" width="92" height="14" fill="#4f46e5"/>
    <!-- buttons -->
    <rect x="86" y="62" width="12" height="10" fill="#22d3ee"/>
    <rect x="22" y="64" width="12" height="10" fill="#facc15"/>
  </g>

  <!-- Wordmark -->
  <g filter="url(#glow)">
    <text x="152" y="92" textLength="349" lengthAdjust="spacingAndGlyphs" font-family="'Arial Black', 'Arial Bold', Impact, sans-serif" font-weight="900" font-size="68" letter-spacing="1" fill="url(#word)">E<tspan fill="#facc15">.</tspan>NGINE</text>
  </g>
  <text x="155" y="140" textLength="330" lengthAdjust="spacing" font-family="'Arial Black', 'Arial Bold', Impact, sans-serif" font-weight="900" font-size="34" letter-spacing="16.5" fill="url(#chrome)">GAMES</text>
  <!-- pixel underline -->
  <g fill="url(#word)" shape-rendering="crispEdges">
    <rect x="155" y="152" width="346" height="6"/>
  </g>
  <g fill="#0b1022" shape-rendering="crispEdges">
    <rect x="215" y="152" width="6" height="6"/>
    <rect x="281" y="152" width="6" height="6"/>
    <rect x="347" y="152" width="6" height="6"/>
    <rect x="413" y="152" width="6" height="6"/>
    <rect x="479" y="152" width="6" height="6"/>
  </g>
</g>
</svg>
