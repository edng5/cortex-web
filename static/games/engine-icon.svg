<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" role="img" aria-label="E.Ngine Games">
  <!-- The E.Ngine Games joystick emblem alone: the node's icon (SVG icons are shown whole, with padding). -->
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <g transform="translate(6 6)" shape-rendering="crispEdges">
    <rect x="0" y="0" width="120" height="120" fill="#0b1022" stroke="url(#word)" stroke-width="6"/>
    <!-- stick ball -->
    <g fill="#f43f5e">
      <rect x="44" y="18" width="24" height="8"/>
      <rect x="36" y="26" width="40" height="24"/>
      <rect x="44" y="50" width="24" height="6"/>
    </g>
    <rect x="44" y="26" width="10" height="8" fill="#fecdd3"/>
    <!-- shaft -->
    <rect x="52" y="56" width="8" height="22" fill="#cbd5e1"/>
    <!-- base -->
    <rect x="20" y="78" width="80" height="12" fill="#818cf8"/>
    <rect x="14" y="90" width="92" height="14" fill="#4f46e5"/>
    <!-- buttons -->
    <rect x="86" y="62" width="12" height="10" fill="#22d3ee"/>
    <rect x="22" y="64" width="12" height="10" fill="#facc15"/>
  </g>
</svg>
